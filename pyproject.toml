[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libraryapi-mcp"
version = "0.1.1"
description = "MCP server for libraryapi.dev — US public library data for AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LibraryAPI", email = "hello@districtapi.dev" }]
requires-python = ">=3.10"
keywords = ["mcp", "library", "libraries", "imls", "public-library", "api"]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://libraryapi.dev"
Repository = "https://github.com/library-api/libraryapi-mcp"

[project.scripts]
libraryapi-mcp = "libraryapi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/libraryapi_mcp"]
